name: Update dependencies

# Both jobs share one schedule but run strictly in sequence via `needs:`
# -- a structural guarantee from GitHub Actions itself, not a timing
# assumption. Previously two separate workflows an hour apart, each
# pushing directly to master with no rebase: a long `nix flake check -L`
# run on one could let the other's push land on a stale ref.
# docs/decisions/0018.
#
# `needs:` alone does NOT make update-mcp-packages see update-flake's
# own push, though -- found by a fresh-agent review, confirmed against
# actions/checkout's own documented default: with no `ref:` override,
# checkout resolves to the SHA that triggered the whole workflow run
# (fixed once, identical across every job in the run), not whatever the
# branch currently points to. Both jobs' own `git pull --rebase` right
# before their push (added below) is the actual fix -- robust against
# ANY other concurrent writer too (this workflow racing itself via
# workflow_dispatch, update-docs.yml's own auto-commits, a human push),
# not just the specific update-flake-then-update-mcp-packages ordering.
#
# `concurrency:` below guards the OTHER overlap this same race shape
# allows: workflow_dispatch firing while last week's scheduled run (or a
# previous manual one) is still mid-flight, two runs of this SAME
# workflow racing each other's push the same way. cancel-in-progress
# stays false, same reasoning as update-docs.yml -- queue the newer run
# behind the current one rather than cancelling a push that may already
# be in flight.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true

      - name: nix flake update
        run: nix flake update

      - name: nix flake check
        run: nix flake check -L

      - name: Commit and push if flake.lock changed
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "bump flake inputs"
          git pull --rebase
          git push

  update-mcp-packages:
    needs: update-flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # See the top-of-file comment -- without this, checkout
          # resolves to the SHA that triggered the run, not the branch
          # tip update-flake just pushed to.
          ref: ${{ github.ref }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true

      - name: Install nix-update
        run: nix profile add nixpkgs#nix-update

      - name: Bump each MCP package to its latest release
        run: |
          for pkg in mcp-victoriametrics mcp-victorialogs mcp-victoriatraces; do
            nix-update --flake "$pkg" --build
          done

      - name: nix flake check
        run: nix flake check -L

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- packages/; then
            echo "no MCP package changes, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/
          git commit -m "mcp: bump package versions"
          git pull --rebase
          git push
