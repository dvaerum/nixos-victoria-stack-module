name: Update dependencies

# Both jobs share one schedule but run strictly in sequence via `needs:`
# -- a structural guarantee from GitHub Actions itself, not a timing
# assumption: a long `nix flake check -L` in one job can't let another's push
# land on a stale ref. docs/decisions/0018.
#
# `needs:` alone does NOT make update-mcp-packages see update-flake's own
# push: with no `ref:` override, actions/checkout resolves to the SHA that
# triggered the run (identical in every job), not the branch tip.
# update-mcp-packages therefore sets `ref: ${{ github.ref }}`, and both jobs
# `git pull --rebase` right before pushing, which also covers any other
# concurrent writer (this workflow racing itself via workflow_dispatch,
# update-docs.yml's auto-commits, a human push).
#
# `concurrency:` below guards the OTHER overlap this same race shape
# allows: workflow_dispatch firing while last week's scheduled run (or a
# previous manual one) is still mid-flight, two runs of this SAME
# workflow racing each other's push the same way. cancel-in-progress
# stays false, same reasoning as update-docs.yml -- queue the newer run
# behind the current one rather than cancelling a push that may already
# be in flight.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true

      - name: nix flake update
        run: nix flake update

      - name: nix flake check
        run: nix flake check -L

      - name: Commit and push if flake.lock changed
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "bump flake inputs"
          git pull --rebase
          git push

  update-mcp-packages:
    needs: update-flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # See the top-of-file comment -- without this, checkout
          # resolves to the SHA that triggered the run, not the branch
          # tip update-flake just pushed to.
          ref: ${{ github.ref }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true

      - name: Install nix-update
        run: nix profile add nixpkgs#nix-update

      - name: Bump each MCP package to its latest release
        run: |
          for pkg in mcp-victoriametrics mcp-victorialogs mcp-victoriatraces; do
            nix-update --flake "$pkg" --build
          done

      # Not "latest release": the cluster binaries must match the vmauth
      # that nixpkgs' victoriametrics ships (after update-flake's bump),
      # and the `-cluster` tag is not a release nix-update would pick.
      - name: Bump the VictoriaMetrics cluster package to pkgs.victoriametrics' version
        run: |
          version=$(nix eval --raw --inputs-from . nixpkgs#victoriametrics.version)
          nix-update --flake victoriametrics-cluster --version "$version" --build

      - name: nix flake check
        run: nix flake check -L

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- packages/; then
            echo "no package changes, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/
          git commit -m "packages: bump versions"
          git pull --rebase
          git push
