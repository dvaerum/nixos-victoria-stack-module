name: CI

# cancel-in-progress: true, unlike the push-capable workflows (0018,
# update-docs.yml): this job only reads, so no write can race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # One stable status for branch protection, whatever the group list is.
  ci:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
