name: CI

# cancel-in-progress for PR/branch runs, unlike the push-capable workflows
# (0018, update-docs.yml): this job only reads, so no write can race. Not on
# main: the suite takes about an hour and main gets several pushes an hour, so
# cancelling would mean no run ever finishes; a newer push replaces only the
# run still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # One stable status for branch protection, whatever the group list is.
  ci:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
