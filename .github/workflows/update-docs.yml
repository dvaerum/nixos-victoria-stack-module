name: Auto Update Docs

on:
  push:
    branches: ['**']

permissions:
  contents: write

# Same race ADR 0018 fixed for the two scheduled update workflows
# (two runs, each pushing directly to the branch with no rebase, can
# land a push on a ref the other's own push is about to invalidate) --
# but this workflow triggers on every push to every branch, so the race
# is between overlapping runs of itself, not between two sibling
# workflows. `needs:` (0018's fix) doesn't apply to a single-job
# workflow; `concurrency:` is the right primitive for serializing runs
# of the same workflow+branch. cancel-in-progress stays false
# deliberately -- queue the newer run behind the current one rather
# than cancelling a push that may already be in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate docs
        run: |
          nix build .#optionsDoc -L
          cp -v result docs/options.md

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain -- docs/options.md)" ]]; then
            git add docs/options.md
            git commit -m "docs: regenerate options.md"
            git push
          else
            echo "No changes to commit."
          fi
