title = "gitleaks config for nixos-victoria-stack-module"

# Extends gitleaks' own bundled default ruleset (confirmed default
# behavior when no `[extend]` with `useDefault = false` is set) --
# this file only adds allowlist entries on top, it doesn't replace the
# base rules.
[extend]
useDefault = true

# Reviewed, deliberately fake test-fixture credentials are exempted inline
# with a trailing `gitleaks:allow` on the line itself, not in a separate
# ignore file: .gitleaksignore fingerprints are line-number based, so they
# go stale whenever an edit shifts lines. A new fixture credential needs
# its own `gitleaks:allow`.
